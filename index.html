<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقات الألماني ↔ العربي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181f;
    --panel:#1b232c;
    --panel-2:#222d38;
    --line: rgba(237,234,227,0.10);
    --paper:#EDEAE3;
    --paper-dim: rgba(237,234,227,0.62);
    --gold:#e2a545;
    --gold-dim: rgba(226,165,69,0.16);
    --teal:#4bb3ad;
    --teal-dim: rgba(75,179,173,0.16);
    --violet:#a48be0;
    --violet-dim: rgba(164,139,224,0.16);
    --rose:#d97a94;
    --bad:#e26a5f;
    --bad-dim: rgba(226,106,95,0.14);
    --good:#6fbf8b;
    --good-dim: rgba(111,191,139,0.14);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(226,165,69,0.10), transparent 45%),
      radial-gradient(circle at 90% 110%, rgba(75,179,173,0.12), transparent 45%),
      var(--ink);
    min-height:100vh;
    color:var(--paper);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .app{ width:100%; max-width:720px; }

  header{ text-align:center; margin-bottom:18px; }
  .eyebrow{
    font-size:12.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--paper-dim); margin-bottom:8px; direction:rtl;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:24px; margin:0 0 18px;
    color:var(--paper); letter-spacing:.01em;
  }

  .switch{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:5px; max-width:560px; margin:0 auto; flex-wrap:wrap;
  }
  .switch button{
    flex:1; min-width:110px; border:none; cursor:pointer;
    padding:11px 10px; border-radius:999px; font-size:13.5px; font-weight:600;
    color:var(--paper-dim); font-family:'IBM Plex Sans Arabic', sans-serif;
    background:transparent;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:color .2s ease, background .2s ease;
  }
  .switch.sub{ margin-top:10px; max-width:420px; }
  #btn-chap-l1.active{ color:var(--ink); background:var(--rose); }
  #btn-chap-k2.active{ color:var(--ink); background:var(--gold); }
  #btn-chap-num.active{ color:var(--ink); background:var(--violet); }
  #btn-ar-de.active{ color:var(--ink); background:var(--gold); }
  #btn-de-ar.active{ color:var(--ink); background:var(--teal); }

  .progress-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:22px 0 8px; font-size:13.5px; color:var(--paper-dim);
  }
  .progress-track{
    height:6px; border-radius:999px; background:var(--panel-2); overflow:hidden; margin-bottom:4px;
    border:1px solid var(--line);
  }
  .progress-fill{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--teal), var(--gold));
    transition:width .35s ease;
  }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 22px; margin-top:16px; box-shadow:0 20px 40px -24px rgba(0,0,0,.6);
  }
  .speaker{
    display:inline-block; font-size:12px; font-weight:600; letter-spacing:.04em;
    color:var(--ink); background:var(--paper); padding:3px 11px; border-radius:999px;
    margin-bottom:14px; direction:ltr;
  }
  .prompt{
    font-size:23px; line-height:1.6; min-height:64px; display:flex; align-items:center; gap:12px;
    margin-bottom:20px;
  }
  .prompt[dir="rtl"]{ font-family:'Amiri', serif; font-size:26px; }
  .prompt[dir="ltr"]{ font-family:'Fraunces', serif; font-weight:500; }
  .prompt-text{ flex:1; }
  #prompt.numbers-prompt .prompt-text{ font-size:44px; font-weight:600; }

  .speak-btn{
    flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background:var(--teal-dim); color:var(--teal); font-size:16px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .2s ease; padding:0;
  }
  .speak-btn:hover{ background:rgba(75,179,173,0.28); }
  .speak-btn:active{ transform:scale(.92); }
  .speak-btn.small{ width:30px; height:30px; font-size:13px; }
  .feedback .row.answer-row-fb{ display:flex; align-items:center; gap:8px; }

  .answer-label{ font-size:12.5px; color:var(--paper-dim); margin-bottom:8px; }
  .answer-row{ display:flex; gap:10px; }
  input[type=text]{
    flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; color:var(--paper); font-size:17px; outline:none;
    font-family:'IBM Plex Sans Arabic', sans-serif; transition:border-color .2s ease, background .2s ease;
  }
  input[type=text][dir="ltr"]{ font-family:'Fraunces', serif; }
  input[type=text][dir="rtl"]{ font-family:'Amiri', serif; }
  input[type=text]:focus{ border-color:var(--gold); background:var(--panel); }
  input[type=text].wrong{ border-color:var(--bad); }
  input[type=text].right{ border-color:var(--good); }

  button.check{
    border:none; border-radius:12px; padding:0 22px; font-size:15px; font-weight:600;
    cursor:pointer; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif; transition:transform .12s ease, opacity .2s ease;
  }
  button.check:hover{ opacity:.9; }
  button.check:active{ transform:scale(.97); }

  .feedback{ margin-top:16px; border-radius:14px; padding:14px 16px; font-size:14.5px; line-height:1.9; display:none; }
  .feedback.show{ display:block; }
  .feedback.bad{ background:var(--bad-dim); border:1px solid rgba(226,106,95,0.35); }
  .feedback.good{ background:var(--good-dim); border:1px solid rgba(111,191,139,0.35); }
  .feedback b{ color:var(--paper); }
  .feedback .row{ margin-bottom:4px; }
  .feedback .row:last-child{ margin-bottom:0; }
  .feedback .tag{ display:inline-block; min-width:88px; color:var(--paper-dim); font-size:12.5px; }

  .nav-row{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; gap:10px; }
  .nav-btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--paper);
    border-radius:12px; padding:11px 16px; font-size:14px; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; gap:6px; transition:border-color .2s ease;
  }
  .nav-btn:hover{ border-color:var(--gold); }
  .nav-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .nav-btn.next{ background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:600; }

  .dotmap-wrap{ margin-top:26px; }
  .dotmap-label{ font-size:12.5px; color:var(--paper-dim); margin-bottom:10px; }
  .dotmap{
    display:flex; flex-wrap:wrap; gap:7px; max-height:118px; overflow-y:auto; padding:2px;
  }
  .dot{
    width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--paper-dim); font-size:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .12s ease;
  }
  .dot:hover{ transform:translateY(-2px); }
  .dot.current{ border-color:var(--paper); color:var(--paper); }
  .dot.correct{ background:var(--good-dim); color:var(--good); border-color:rgba(111,191,139,.4); }
  .dot.incorrect{ background:var(--bad-dim); color:var(--bad); border-color:rgba(226,106,95,.4); }
  .dot.flagged{ background:rgba(226,196,50,0.22); color:#e8cf3d; border-color:rgba(226,196,50,.55); }

  .flag-row{ display:flex; justify-content:center; margin-top:14px; }
  .flag-btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--paper-dim);
    border-radius:999px; padding:9px 18px; font-size:13px; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; gap:7px; transition:all .2s ease;
  }
  .flag-btn.on{ background:rgba(226,196,50,0.18); color:#e8cf3d; border-color:rgba(226,196,50,.5); }

  .reset-row{ text-align:center; margin-top:14px; }
  .reset-btn{
    border:1px solid rgba(226,106,95,.35); background:rgba(226,106,95,.08); color:var(--bad);
    border-radius:999px; padding:8px 16px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .reset-btn:hover{ background:rgba(226,106,95,.18); }

  footer{ text-align:center; margin-top:28px; font-size:12px; color:var(--paper-dim); }

  @media (max-width:480px){
    .prompt{ font-size:20px; }
    .prompt[dir="rtl"]{ font-size:22px; }
    #prompt.numbers-prompt .prompt-text{ font-size:34px; }
    .answer-row{ flex-direction:column; }
    button.check{ padding:13px; }
    .switch button{ min-width:88px; font-size:12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">مراجعة الألماني</div>
    <h1>بطاقات <span>الألماني</span> ↔ Deutsch</h1>

    <div class="switch" id="chapter-switch">
      <button id="btn-chap-l1" class="active">الدرس الأول</button>
      <button id="btn-chap-k2">الدرس الثاني</button>
      <button id="btn-chap-num">الأرقام 🔢</button>
    </div>

    <div class="switch sub" id="dir-switch">
      <button id="btn-ar-de" class="active">عربي → ألماني</button>
      <button id="btn-de-ar">ألماني → عربي</button>
    </div>
  </header>

  <div class="progress-row">
    <span id="progress-text">السؤال 1 من 1</span>
    <span id="score-text">صحيح: 0</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:2%"></div></div>

  <div class="card">
    <div id="speaker" class="speaker" style="display:none"></div>
    <div id="prompt" class="prompt" dir="rtl"></div>

    <div class="answer-label" id="answer-label">اكتب الترجمة بالألمانية:</div>
    <div class="answer-row">
      <input type="text" id="answer-input" dir="ltr" autocomplete="off" spellcheck="false">
      <button type="button" class="speak-btn" id="answer-speak-btn" style="display:none" aria-label="نطق الإجابة بالألمانية">🔊</button>
      <button class="check" id="check-btn">تحقق</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="nav-row">
      <button class="nav-btn" id="prev-btn">◀ السابق</button>
      <button class="nav-btn next" id="next-btn">التالي ▶</button>
    </div>

    <div class="flag-row">
      <button type="button" class="flag-btn" id="flag-btn">🚩 علّم السؤال ده للمراجعة</button>
    </div>
  </div>

  <div class="reset-row">
    <button type="button" class="reset-btn" id="reset-btn">🗑️ امسح كل الإجابات والتقدّم</button>
  </div>

  <div class="dotmap-wrap">
    <div class="dotmap-label">انتقل إلى أي سؤال:</div>
    <div class="dotmap" id="dotmap"></div>
  </div>

  <footer>الإجابات والتقدّم محفوظة تلقائيًا على هذا الجهاز باستخدام Local Storage — حتى بعد إغلاق الصفحة.</footer>
</div>

/* ===================== DATA: Numbers 0-100 (shuffled) ===================== */
const ONES = ["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn",
  "elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
const TENS = {20:"zwanzig",30:"dreißig",40:"vierzig",50:"fünfzig",60:"sechzig",70:"siebzig",80:"achtzig",90:"neunzig"};
function germanNumberWord(n){
  if(n <= 19) return ONES[n];
  if(n === 100) return "hundert";
  const t = Math.floor(n/10)*10, o = n%10;
  if(o === 0) return TENS[t];
  return (o===1 ? "ein" : ONES[o]) + "und" + TENS[t];
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
const NUMBERS = shuffle(Array.from({length:101}, (_,n)=>({digit:String(n), word:germanNumberWord(n)})));


/* ===================== localStorage persistence ===================== */
const STORAGE_KEY = 'germanQuizState_v1';

function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      chapter,
      direction,
      pointer,
      STATE
    }));
  }catch(e){
    console.warn('تعذر حفظ التقدم في Local Storage', e);
  }
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);

    if(saved.chapter === 'l1' || saved.chapter === 'k2' || saved.chapter === 'numbers'){
      chapter = saved.chapter;
    }
    if(saved.direction === 'ar-de' || saved.direction === 'de-ar'){
      direction = saved.direction;
    }
    if(saved.pointer && typeof saved.pointer === 'object'){
      pointer = {
        l1: Number.isInteger(saved.pointer.l1) ? saved.pointer.l1 : 0,
        k2: Number.isInteger(saved.pointer.k2) ? saved.pointer.k2 : 0,
        numbers: Number.isInteger(saved.pointer.numbers) ? saved.pointer.numbers : 0
      };
    }

    if(saved.STATE && typeof saved.STATE === 'object'){
      Object.keys(STATE).forEach(key => {
        if(Array.isArray(saved.STATE[key]) && saved.STATE[key].length === STATE[key].length){
          STATE[key] = saved.STATE[key].map(item => ({
            status: item?.status === 'correct' || item?.status === 'incorrect' ? item.status : null,
            typed: typeof item?.typed === 'string' ? item.typed : '',
            flagged: !!item?.flagged
          }));
        }
      });
    }
  }catch(e){
    console.warn('تعذر تحميل التقدم من Local Storage', e);
  }
}

function makeState(len){ return Array.from({length:len}, ()=>({status:null, typed:"", flagged:false})); }
const STATE = {
  'l1_ar-de': makeState(ITEMS_L1.length),

};

loadLocal();

let deVoice = null;
let voiceNoticeShown = false;
function pickGermanVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  // prefer an exact de-DE voice, then any German variant (de-AT, de-CH...), then anything starting with "de"
  deVoice = voices.find(v => v.lang && v.lang.toLowerCase() === 'de-de')
        || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('de-'))
        || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('de'))
        || null;
  return deVoice;
}
if('speechSynthesis' in window){
  pickGermanVoice();
  window.speechSynthesis.onvoiceschanged = pickGermanVoice;
}
function speakGerman(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  const doSpeak = ()=>{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    const voice = pickGermanVoice(); // re-check live, voices list can load late
    if(voice){ u.voice = voice; }
    else if(!voiceNoticeShown){
      voiceNoticeShown = true;
      answerLabelEl.title = 'لا يوجد صوت ألماني مثبت على جهازك، فالنطق سيكون بلهجة افتراضية. ثبّت لغة ألمانية في إعدادات النطق (Text-to-Speech) بجهازك للحصول على نطق ألماني صحيح.';
    }
    u.rate = 0.92;
    window.speechSynthesis.speak(u);
  };

  // Chrome sometimes returns an empty voice list on first call; give it one retry shortly after.
  if(window.speechSynthesis.getVoices().length === 0){
    setTimeout(doSpeak, 150);
  } else {
    doSpeak();
  }
}
function makeSpeakButton(text, small){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'speak-btn' + (small ? ' small' : '');
  btn.setAttribute('aria-label', 'نطق بالألمانية');
  btn.textContent = '🔊';
  btn.addEventListener('click', (e)=>{ e.stopPropagation(); speakGerman(text); });
  return btn;
}

/* ===================== normalization ===================== */
function normalize(s){
  return s
    .toLowerCase()
    .replace(/[!?.,;:؟،؛«»"'ʼ]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function normalizeDigits(s){
  return (s.match(/\d+/g) || []).join('');
}

/* ===================== dots ===================== */
function buildDots(){
  dotmap.innerHTML = "";
  const arr = data();
  arr.forEach((it, i)=>{
    const d = document.createElement('div');
    d.className = 'dot';
    d.textContent = i+1;
    d.addEventListener('click', ()=>{ setCurrent(i); saveLocal(); render(); });
    dotmap.appendChild(d);
  });
}
function updateDots(){
  const dots = dotmap.children;
  const idx = current();
  const st = curState();
  for(let i=0;i<data().length;i++){
    const s = st[i].status;
    let cls = 'dot' + (i===idx ? ' current' : '') +
      (s==='correct' ? ' correct' : s==='incorrect' ? ' incorrect' : '');
    if(st[i].flagged){ cls += ' flagged'; }
    dots[i].className = cls;
  }
}
function score(){ return curState().filter(s=>s.status==='correct').length; }

/* ===================== render ===================== */
function correctAnswer(){
  const idx = current();
  if(chapter === 'numbers'){ return NUMBERS[idx].word; }
  const item = data()[idx];
  return direction === 'ar-de' ? item.de : item.ar;
}

function render(){
  const idx = current();
  const arr = data();
  const s = curState()[idx];

  promptEl.classList.toggle('numbers-prompt', chapter==='numbers');
  promptEl.innerHTML = '';
  const promptText = document.createElement('span');
  promptText.className = 'prompt-text';

  if(chapter === 'numbers'){
    speakerEl.style.display = 'none';
    const item = NUMBERS[idx];
    promptEl.setAttribute('dir','ltr');
    promptText.textContent = item.digit;
    promptEl.appendChild(promptText);
    answerLabelEl.textContent = 'اكتب الرقم بالكلمة الألمانية:';
    inputEl.setAttribute('dir','ltr');
    inputEl.placeholder = 'مثال: sieben';
    answerSpeakBtn.style.display = 'inline-flex';
    answerSpeakBtn.onclick = ()=> speakGerman(correctAnswer());
  } else {
    const item = arr[idx];
    if(item.sp){ speakerEl.style.display='inline-block'; speakerEl.textContent = item.sp; }
    else { speakerEl.style.display='none'; }

    if(direction === 'ar-de'){
      promptEl.setAttribute('dir','rtl');
      promptText.textContent = item.ar;
      promptEl.appendChild(promptText);
      answerLabelEl.textContent = 'اكتب الترجمة بالألمانية:';
      inputEl.setAttribute('dir','ltr');
      inputEl.placeholder = 'Antwort auf Deutsch …';
      answerSpeakBtn.style.display = 'inline-flex';
      answerSpeakBtn.onclick = ()=> speakGerman(correctAnswer());
    } else {
      promptEl.setAttribute('dir','ltr');
      promptText.textContent = item.de;
      promptEl.appendChild(promptText);
      promptEl.appendChild(makeSpeakButton(item.de));
      answerLabelEl.textContent = 'اكتب المعنى بالعربية:';
      inputEl.setAttribute('dir','rtl');
      inputEl.placeholder = 'اكتب المعنى هنا…';
      answerSpeakBtn.style.display = 'none';
    }
  }

  inputEl.value = s.typed || "";
  inputEl.classList.remove('right','wrong');
  feedbackEl.classList.remove('show','good','bad');
  feedbackEl.innerHTML = "";

  if(s.status === 'correct'){
    inputEl.classList.add('right');
  } else if(s.status === 'incorrect'){
    inputEl.classList.add('wrong');
    showFeedback(false, s.typed, correctAnswer());
  }

  progressText.textContent = `السؤال ${idx+1} من ${arr.length}`;
  scoreText.textContent = `صحيح: ${score()}`;
  progressFill.style.width = `${((idx+1)/arr.length)*100}%`;

  el('prev-btn').disabled = idx === 0;
  el('next-btn').textContent = (idx === arr.length-1) ? 'انتهى ✓' : 'التالي ▶';

  updateDots();
  updateFlagBtn();
  inputEl.focus();
}

function updateFlagBtn(){
  const idx = current();
  const flagged = curState()[idx].flagged;
  flagBtn.classList.toggle('on', !!flagged);
  flagBtn.textContent = flagged ? '🚩 مُعلَّم للمراجعة — دوس لإلغاء العلامة' : '🚩 علّم السؤال ده للمراجعة';
}

function showFeedback(isCorrect, typed, correct){
  feedbackEl.classList.add('show', isCorrect ? 'good' : 'bad');
  feedbackEl.innerHTML = '';
  const isGermanAnswer = (chapter === 'numbers') || (direction === 'ar-de');

  if(isCorrect){
    const row = document.createElement('div');
    row.className = 'row answer-row-fb';
    row.innerHTML = `✅ <b>إجابة صحيحة!</b>&nbsp;ينتقل السؤال التالي تلقائيًا…`;
    if(isGermanAnswer){ row.appendChild(makeSpeakButton(correct, true)); }
    feedbackEl.appendChild(row);
  } else {
    const row1 = document.createElement('div');
    row1.className = 'row';
    row1.innerHTML = `<span class="tag">إجابتك:</span> ${typed ? escapeHtml(typed) : '<i>(فارغ)</i>'}`;

    const row2 = document.createElement('div');
    row2.className = 'row answer-row-fb';
    row2.innerHTML = `<span class="tag">الإجابة الصحيحة:</span> <b>${escapeHtml(correct)}</b>`;
    if(isGermanAnswer){ row2.appendChild(makeSpeakButton(correct, true)); }

    const row3 = document.createElement('div');
    row3.className = 'row';
    row3.innerHTML = `<span class="tag">تصحيح:</span> قارن إجابتك بالإجابة الصحيحة أعلاه، ثم أعد المحاولة حتى تكتبها صح.`;

    feedbackEl.appendChild(row1);
    feedbackEl.appendChild(row2);
    feedbackEl.appendChild(row3);
  }
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function checkAnswer(){
  const idx = current();
  const typed = inputEl.value;
  const correct = correctAnswer();
  let ok;
  if(chapter === 'numbers'){
    const byWord = normalize(typed) === normalize(NUMBERS[idx].word);
    const t = normalizeDigits(typed);
    const byDigit = t.length > 0 && t === NUMBERS[idx].digit;
    ok = byWord || byDigit;
  } else {
    ok = normalize(typed) === normalize(correct) && normalize(typed).length > 0;
  }
  curState()[idx] = {status: ok ? 'correct' : 'incorrect', typed};
  saveLocal();

  if(ok){
    inputEl.classList.remove('wrong'); inputEl.classList.add('right');
    showFeedback(true, typed, correct);
    updateDots();
    scoreText.textContent = `صحيح: ${score()}`;
    setTimeout(()=>{
      const arr = data();
      if(idx < arr.length-1){ setCurrent(idx+1); saveLocal(); render(); }
    }, 1200);
  } else {
    inputEl.classList.remove('right'); inputEl.classList.add('wrong');
    showFeedback(false, typed, correct);
    updateDots();
  }
}

el('check-btn').addEventListener('click', checkAnswer);
inputEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); }});

el('prev-btn').addEventListener('click', ()=>{ const i=current(); if(i>0){ setCurrent(i-1); saveLocal(); render(); }});
el('next-btn').addEventListener('click', ()=>{ const i=current(); if(i < data().length-1){ setCurrent(i+1); saveLocal(); render(); } });

flagBtn.addEventListener('click', ()=>{
  const idx = current();
  const s = curState()[idx];
  s.flagged = !s.flagged;
  saveLocal();
  updateDots();
  updateFlagBtn();
});

resetBtn.addEventListener('click', ()=>{
  const sure = window.confirm('هل أنت متأكد؟ هيتم مسح كل الإجابات والتقدّم في كل الأقسام (الدرس الأول، الدرس الثاني، والأرقام) ومش هترجع تاني.');
  if(!sure) return;
  Object.keys(STATE).forEach(key=>{
    STATE[key] = makeState(STATE[key].length);
  });
  pointer = { l1: 0, k2: 0, numbers: 0 };
  saveLocal();
  render();
});

function setChapter(newChapter){
  chapter = newChapter;
  saveLocal();
  el('btn-chap-l1').classList.toggle('active', chapter==='l1');
  el('btn-chap-k2').classList.toggle('active', chapter==='k2');
  el('btn-chap-num').classList.toggle('active', chapter==='numbers');
  dirSwitch.style.display = (chapter === 'numbers') ? 'none' : 'flex';
  buildDots();
  render();
}
function setDirection(newDir){
  direction = newDir;
  saveLocal();
  el('btn-ar-de').classList.toggle('active', direction==='ar-de');
  el('btn-de-ar').classList.toggle('active', direction==='de-ar');
  render();
}
el('btn-chap-l1').addEventListener('click', ()=>setChapter('l1'));
el('btn-chap-k2').addEventListener('click', ()=>setChapter('k2'));
el('btn-chap-num').addEventListener('click', ()=>setChapter('numbers'));
el('btn-ar-de').addEventListener('click', ()=>setDirection('ar-de'));
el('btn-de-ar').addEventListener('click', ()=>setDirection('de-ar'));

buildDots();
render();
</script>
</body>
</html>
